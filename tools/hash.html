<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>비밀번호 설정값 만들기</title>
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="../style.css">
<link rel="stylesheet" href="hash.css">
</head>
<body>
<main class="tool">
  <h1 class="tool__title">비밀번호 설정값 만들기</h1>

  <p class="tool__lead">
    아래에 쓸 비밀번호를 넣으면 Cloudflare에 등록할 값 세 개가 나옵니다.
    계산은 이 브라우저 안에서만 일어나고, 비밀번호는 어디로도 전송되지 않습니다.
    인터넷을 끊고 써도 됩니다.
  </p>

  <label class="tool__label" for="pw">비밀번호</label>
  <input type="password" id="pw" class="gate__input" autocomplete="new-password">

  <label class="tool__label" for="pw2">한 번 더</label>
  <input type="password" id="pw2" class="gate__input" autocomplete="new-password">

  <p class="tool__msg" id="msg"></p>

  <button type="button" class="btn btn--primary tool__btn" id="go">만들기</button>

  <section class="tool__out" id="out" hidden>
    <p class="tool__lead">
      Pages 프로젝트 → Settings → 환경 변수에 이 세 개를 그대로 넣으세요.
      <strong>MEMO_VERIFIER는 Secret(암호화)으로 저장하세요.</strong>
    </p>

    <label class="tool__label" for="salt">MEMO_SALT</label>
    <textarea id="salt" class="tool__value" rows="2" readonly></textarea>

    <label class="tool__label" for="verifier">MEMO_VERIFIER</label>
    <textarea id="verifier" class="tool__value" rows="3" readonly></textarea>

    <label class="tool__label" for="iter">MEMO_ITERATIONS</label>
    <textarea id="iter" class="tool__value" rows="1" readonly></textarea>

    <p class="tool__warn">
      이 값들로는 비밀번호를 되돌릴 수 없습니다. 비밀번호를 잊으면 이 도구로
      새로 만들어 환경 변수를 바꿔야 합니다. 메모는 그대로 남습니다.
    </p>
  </section>
</main>
<script src="hash.js"></script>
</body>
</html>
